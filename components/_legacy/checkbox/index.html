<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>moh-checkbox · 复选框</title>
  <link rel="stylesheet" href="../../themes/mo-light/tokens.css" />
  <style>
    /* ============================================================
       moh-checkbox · 复选框（灰墨 MoH_UI 单文件组件）
       依赖：tokens.css 的 --moh-* 变量
       用法：复制本文件 <style> 与需要的 HTML 片段到你的项目
       形态：原生 input[type=checkbox] + accent-color 主题化
       要点：accent-color 方案保留原生键盘/屏读语义，零 JS；
         焦点可见用 focus-visible；禁用态降透明度
       ============================================================ */

    .moh-checkbox {
      display: inline-flex;
      align-items: center;
      gap: var(--moh-space-2);
      font-size: var(--moh-text-sm);
      color: var(--moh-ink);
      cursor: pointer;
      user-select: none;
    }

    /* 原生 input：尺寸放大 + 主色 */
    .moh-checkbox__input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--moh-primary);
      cursor: pointer;
      flex-shrink: 0;
    }

    .moh-checkbox__input:focus-visible {
      outline: 2px solid var(--moh-primary);
      outline-offset: 2px;
      border-radius: var(--moh-radius-sm);
    }

    /* 禁用态 */
    .moh-checkbox--disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .moh-checkbox--disabled .moh-checkbox__input {
      cursor: not-allowed;
    }

    /* ========== 演示容器（非组件样式） ========== */
    .demo-wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--moh-space-4);
      padding: var(--moh-space-6);
      background: var(--moh-canvas);
      border-bottom: 1px solid var(--moh-border);
    }
    .demo-note {
      font-size: var(--moh-text-xs);
      color: var(--moh-muted);
      padding: var(--moh-space-3) var(--moh-space-6);
      margin: 0;
      background: var(--moh-canvas);
    }
  </style>
</head>
<body>
  <div class="demo-wrap">
    <label class="moh-checkbox">
      <input class="moh-checkbox__input" type="checkbox" checked />
      <span>接收通知</span>
    </label>
    <label class="moh-checkbox">
      <input class="moh-checkbox__input" type="checkbox" />
      <span>同时抄送团队</span>
    </label>
    <label class="moh-checkbox moh-checkbox--disabled">
      <input class="moh-checkbox__input" type="checkbox" disabled />
      <span>已停用的选项</span>
    </label>
  </div>
  <p class="demo-note">提示：accent-color 跟随 --moh-primary 自动换主题；键盘空格可切换、屏读自动读状态；禁用态降透明度并禁点。</p>
</body>
</html>
