<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>moh-avatar · 头像</title>
  <link rel="stylesheet" href="../../themes/mo-light/tokens.css" />
  <style>
    /* ============================================================
       moh-avatar · 头像（灰墨 MoH_UI 单文件组件）
       依赖：tokens.css 的 --moh-* 变量
       用法：复制本文件 <style> 与需要的 HTML 片段到你的项目
       形态：图片 / 文字缩写 / 图标占位；sm-md-lg 三尺寸；
         圆形或圆角；可选在线状态点
       要点：缩写头像用 primary-muted 底 + primary 文字（变量）；
         图片失败回退（img 错误时隐藏、文字兜底）
       ============================================================ */

    .moh-avatar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--moh-primary-muted);
      color: var(--moh-primary);
      font-weight: 600;
      line-height: 1;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
    }

    /* 圆角方形变体 */
    .moh-avatar--square {
      border-radius: var(--moh-radius-md);
    }

    /* 尺寸 */
    .moh-avatar--sm { width: 24px; height: 24px; font-size: var(--moh-text-xs); }
    .moh-avatar--md { width: 32px; height: 32px; font-size: var(--moh-text-sm); }
    .moh-avatar--lg { width: 40px; height: 40px; font-size: var(--moh-text-md); }

    .moh-avatar__img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 在线状态点：右下角小圆点 */
    .moh-avatar__dot {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--moh-success);
      border: 2px solid var(--moh-surface);
    }
    .moh-avatar__dot--offline {
      background: var(--moh-border-strong);
    }

    /* 可访问性：头像若作为可点击元素（如链接到个人页），焦点必须可见 */
    .moh-avatar a:focus-visible,
    .moh-avatar button:focus-visible {
      outline: 2px solid var(--moh-primary);
      outline-offset: 2px;
      border-radius: var(--moh-radius-md);
    }

    /* ========== 演示容器（非组件样式） ========== */
    .demo-wrap {
      display: flex;
      align-items: center;
      gap: var(--moh-space-4);
      padding: var(--moh-space-6);
      background: var(--moh-canvas);
      border-bottom: 1px solid var(--moh-border);
    }
    .demo-note {
      font-size: var(--moh-text-xs);
      color: var(--moh-muted);
      padding: var(--moh-space-3) var(--moh-space-6);
      margin: 0;
      background: var(--moh-canvas);
    }
  </style>
</head>
<body>
  <div class="demo-wrap">
    <!-- 图片头像 -->
    <span class="moh-avatar moh-avatar--md">
      <img class="moh-avatar__img" src="https://picsum.photos/64/64" alt="用户头像" onerror="this.style.display='none'" />
    </span>
    <!-- 文字缩写（无图兜底） -->
    <span class="moh-avatar moh-avatar--md" aria-label="高原">高</span>
    <span class="moh-avatar moh-avatar--lg" aria-label="Noii">N</span>
    <!-- 圆角方形 + 在线点 -->
    <span class="moh-avatar moh-avatar--md moh-avatar--square" aria-label="在线用户">
      <span>在</span>
      <span class="moh-avatar__dot" aria-hidden="true"></span>
    </span>
    <!-- 离线点 -->
    <span class="moh-avatar moh-avatar--md" aria-label="离线用户">
      <span>离</span>
      <span class="moh-avatar__dot moh-avatar__dot--offline" aria-hidden="true"></span>
    </span>
  </div>
  <p class="demo-note">提示：缩写头像底色 primary-muted、文字 primary（变量）；图片加载失败自动隐藏、文字兜底；在线点绿/离线灰。</p>
</body>
</html>
