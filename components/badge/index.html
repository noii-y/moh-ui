<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>moh-badge · 徽章</title>
  <link rel="stylesheet" href="../../themes/mo-light/tokens.css" />
  <style>
    /* ============================================================
       moh-badge · 徽章（灰墨 MoH_UI 单文件组件）
       依赖：tokens.css 的 --moh-* 变量
       用法：复制本文件 <style> 与需要的 HTML 片段到你的项目
       形态：计数徽章（99+）/ 圆点 / 附着角标（绝对定位）
       要点：角标容器 position:relative；计数 ≥100 显示 99+；
         屏读在按钮 aria-label 中给出计数，避免读"99加"
       ============================================================ */

    /* 角标容器 */
    .moh-badge__host {
      position: relative;
      display: inline-flex;
    }

    /* 独立计数徽章 */
    .moh-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 9px;
      background: var(--moh-danger);
      color: #ffffff;
      font-size: var(--moh-text-xs);
      font-weight: 600;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    /* 附着角标：右上角 */
    .moh-badge--anchor {
      position: absolute;
      top: -4px;
      right: -6px;
    }

    /* 中性色变体 */
    .moh-badge--neutral {
      background: var(--moh-border-strong);
    }
    .moh-badge--primary {
      background: var(--moh-primary);
    }

    /* 圆点徽章 */
    .moh-badge--dot {
      min-width: 0;
      width: 8px;
      height: 8px;
      padding: 0;
      border-radius: 50%;
    }

    /* 演示触发元素 */
    .demo-trigger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: var(--moh-control-height);
      padding: 0 var(--moh-space-4);
      border: 1px solid var(--moh-border);
      border-radius: var(--moh-radius-md);
      background: var(--moh-surface);
      color: var(--moh-ink);
      font-size: var(--moh-text-sm);
      font-family: inherit;
      cursor: pointer;
      transition: var(--moh-transition);
    }
    .demo-trigger:hover { border-color: var(--moh-border-strong); background: var(--moh-surface-2); }
    .demo-trigger:focus-visible {
      outline: 2px solid var(--moh-primary);
      outline-offset: 2px;
    }

    /* ========== 演示容器（非组件样式） ========== */
    .demo-wrap {
      display: flex;
      align-items: center;
      gap: var(--moh-space-6);
      padding: var(--moh-space-6);
      background: var(--moh-canvas);
      border-bottom: 1px solid var(--moh-border);
    }
    .demo-note {
      font-size: var(--moh-text-xs);
      color: var(--moh-muted);
      padding: var(--moh-space-3) var(--moh-space-6);
      margin: 0;
      background: var(--moh-canvas);
    }
  </style>
</head>
<body>
  <div class="demo-wrap">
    <!-- 附着角标（消息） -->
    <span class="moh-badge__host">
      <button class="demo-trigger" aria-label="消息，3 条未读">消息</button>
      <span class="moh-badge moh-badge--anchor" aria-hidden="true">3</span>
    </span>

    <!-- 附着角标（99+） -->
    <span class="moh-badge__host">
      <button class="demo-trigger" aria-label="通知，99 条以上未读">通知</button>
      <span class="moh-badge moh-badge--anchor" aria-hidden="true">99+</span>
    </span>

    <!-- 圆点角标 -->
    <span class="moh-badge__host">
      <button class="demo-trigger" aria-label="有新的动态">动态</button>
      <span class="moh-badge moh-badge--dot moh-badge--anchor" aria-hidden="true"></span>
    </span>

    <!-- 独立徽章（中性/主色） -->
    <span class="moh-badge moh-badge--neutral">Beta</span>
    <span class="moh-badge moh-badge--primary">新</span>
  </div>
  <p class="demo-note">提示：角标 aria-hidden（计数已在按钮 aria-label 表达，避免屏读"99加"）；危险红默认、中性/主色可选；圆点徽章适合"有新动态"。</p>
</body>
</html>
