<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>moh-chart-card · 图表卡（ECharts）</title>
  <link rel="stylesheet" href="../../themes/mo-light/tokens.css" />
  <!-- 依赖：ECharts（CDN，需网络；或下载到本地 vendor/ 后改为相对路径） -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    /* ============================================================
       moh-chart-card · 图表卡（灰墨 MoH_UI 增强组件）
       依赖：ECharts 5（CDN 或本地 vendor），tokens.css 的 --moh-* 变量
       用法：复制 <style> + HTML 片段 + <script>；图表颜色从变量读取，
         换任何主题都会自动适配（浅色/深色都正确）
       要点：图表容器有明确高度；无数据时显示"暂无数据"文本；
         卡片壳复用统计卡同款视觉
       ============================================================ */

    .moh-chart-card {
      display: flex;
      flex-direction: column;
      gap: var(--moh-space-3);
      padding: var(--moh-space-4);
      background: var(--moh-surface);
      border: 1px solid var(--moh-border);
      border-radius: var(--moh-radius-lg);
      box-shadow: var(--moh-shadow-sm);
      max-width: 560px;
    }

    .moh-chart-card__header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--moh-space-3);
    }

    .moh-chart-card__title {
      font-size: var(--moh-text-md);
      font-weight: 600;
      color: var(--moh-ink);
      line-height: 1.4;
    }

    .moh-chart-card__sub {
      font-size: var(--moh-text-xs);
      color: var(--moh-muted);
      margin-top: 2px;
    }

    .moh-chart-card__chart {
      width: 100%;
      height: 240px;
    }

    .moh-chart-card__foot {
      font-size: var(--moh-text-xs);
      color: var(--moh-muted);
      padding-top: var(--moh-space-2);
      border-top: 1px solid var(--moh-border);
    }

    /* 可访问性：图表卡内若出现可交互元素，焦点必须可见 */
    .moh-chart-card a:focus-visible,
    .moh-chart-card button:focus-visible {
      outline: 2px solid var(--moh-primary);
      outline-offset: 2px;
      border-radius: var(--moh-radius-sm);
    }

    /* ========== 演示容器（非组件样式） ========== */
    .demo-wrap {
      padding: var(--moh-space-6);
      background: var(--moh-canvas);
      border-bottom: 1px solid var(--moh-border);
    }
    .demo-note {
      font-size: var(--moh-text-xs);
      color: var(--moh-muted);
      padding: var(--moh-space-3) var(--moh-space-6);
      margin: 0;
      background: var(--moh-canvas);
    }
  </style>
</head>
<body>
  <div class="demo-wrap">
    <div class="moh-chart-card">
      <div class="moh-chart-card__header">
        <div>
          <div class="moh-chart-card__title">月度访问趋势</div>
          <div class="moh-chart-card__sub">近 6 个月页面访问量</div>
        </div>
      </div>
      <div class="moh-chart-card__chart" id="demo-chart" role="img" aria-label="近6个月页面访问量折线趋势图"></div>
      <div class="moh-chart-card__foot">数据来源：演示数据（非真实业务数据）</div>
    </div>
  </div>

  <script>
    /* 主题适配：所有颜色从 --moh-* 变量读取，换主题自动适配 */
    (function () {
      if (typeof echarts === "undefined") {
        document.getElementById("demo-chart").textContent = "图表加载失败：请确认 ECharts 已引入（CDN 需网络）。";
        return;
      }
      const css = getComputedStyle(document.documentElement);
      const v = (name) => css.getPropertyValue("--moh-" + name).trim();

      const chart = echarts.init(document.getElementById("demo-chart"));
      const option = {
        grid: { left: 40, right: 16, top: 24, bottom: 28 },
        tooltip: { trigger: "axis", backgroundColor: v("surface"), borderColor: v("border"), textStyle: { color: v("ink") } },
        xAxis: {
          type: "category",
          data: ["5月", "6月", "7月", "8月", "9月", "10月"],
          axisLine: { lineStyle: { color: v("border") } },
          axisLabel: { color: v("muted") },
        },
        yAxis: {
          type: "value",
          splitLine: { lineStyle: { color: v("border"), type: "dashed" } },
          axisLabel: { color: v("muted") },
        },
        series: [
          {
            type: "line",
            data: [820, 932, 901, 1290, 1330, 1420],
            smooth: true,
            symbolSize: 6,
            lineStyle: { color: v("primary"), width: 2 },
            itemStyle: { color: v("primary") },
            areaStyle: { color: v("primary"), opacity: 0.08 },
          },
        ],
      };
      chart.setOption(option);
      window.addEventListener("resize", () => chart.resize());
    })();
  </script>

  <p class="demo-note">提示：柱状图把 series 的 type 改 "bar"；环形图用 type "pie" + radius ["45%","70%"]（教程见 README）。所有颜色走 --moh-* 变量，切任意主题（含深色）自动适配。</p>
</body>
</html>
