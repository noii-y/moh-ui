<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>单选框 Radio · 灰墨组件</title>
<link rel="stylesheet" href="../../../vendor/daisyui.css" />
<link rel="stylesheet" href="../../../assets/utilities-patch.css" />
<link rel="stylesheet" href="../../../assets/demo-page.css" />
<script src="../../../assets/demo-embed.js"></script>
</head>
<body>
<header class="doc-head">
  <h1>单选框 <span class="en">Radio</span></h1>
  <p>从一组互斥选项中选一个。同一组必须使用相同的 name。示例结构搬运自 daisyUI 官方文档。</p>
  <p>来源：<a href="https://daisyui.com/components/radio/" target="_blank" rel="noopener">daisyui.com/components/radio</a>（MIT）</p>
</header>

<main class="doc-wrap">

  <section class="doc-block">
    <h2>基础</h2>
    <div class="doc-stage">
      <input type="radio" name="r1" class="radio" checked="checked" />
      <input type="radio" name="r1" class="radio" />
      <input type="radio" name="r1" class="radio" />
    </div>
  </section>

  <section class="doc-block">
    <h2>选项组（带文字）</h2>
    <div class="doc-stage">
      <fieldset class="fieldset bg-base-100 border-base-300 rounded-box w-64 border p-4">
        <legend class="fieldset-legend">配送方式</legend>
        <label class="label cursor-pointer"><span>标准配送（3-5 天）</span><input type="radio" name="ship" class="radio radio-primary" checked /></label>
        <label class="label cursor-pointer"><span>次日达</span><input type="radio" name="ship" class="radio radio-primary" /></label>
        <label class="label cursor-pointer"><span>自提</span><input type="radio" name="ship" class="radio radio-primary" /></label>
      </fieldset>
    </div>
  </section>

  <section class="doc-block">
    <h2>尺寸</h2>
    <div class="doc-stage">
      <input type="radio" name="r2" class="radio radio-xs" checked="checked" />
      <input type="radio" name="r2" class="radio radio-sm" checked="checked" />
      <input type="radio" name="r2" class="radio radio-md" checked="checked" />
      <input type="radio" name="r2" class="radio radio-lg" checked="checked" />
      <input type="radio" name="r2" class="radio radio-xl" checked="checked" />
    </div>
  </section>

  <section class="doc-block">
    <h2>颜色</h2>
    <div class="doc-stage">
      <input type="radio" name="r3" class="radio radio-neutral" checked="checked" />
      <input type="radio" name="r4" class="radio radio-primary" checked="checked" />
      <input type="radio" name="r5" class="radio radio-secondary" checked="checked" />
      <input type="radio" name="r6" class="radio radio-accent" checked="checked" />
      <input type="radio" name="r7" class="radio radio-success" checked="checked" />
      <input type="radio" name="r8" class="radio radio-warning" checked="checked" />
      <input type="radio" name="r9" class="radio radio-info" checked="checked" />
      <input type="radio" name="r10" class="radio radio-error" checked="checked" />
    </div>
  </section>

  <section class="doc-block">
    <h2>禁用</h2>
    <div class="doc-stage">
      <input type="radio" name="r11" class="radio" disabled checked="checked" />
      <input type="radio" name="r11" class="radio" disabled />
    </div>
  </section>

</main>
</body>
</html>
