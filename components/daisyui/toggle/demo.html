<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>开关 Toggle · 灰墨组件</title>
<link rel="stylesheet" href="../../../vendor/daisyui.css" />
<link rel="stylesheet" href="../../../assets/utilities-patch.css" />
<link rel="stylesheet" href="../../../assets/demo-page.css" />
</head>
<body>
<header class="doc-head">
  <h1>开关 <span class="en">Toggle</span></h1>
  <p>本质是被样式化成开关的复选框，用于开/关两种状态。示例结构搬运自 daisyUI 官方文档。</p>
  <p>来源：<a href="https://daisyui.com/components/toggle/" target="_blank" rel="noopener">daisyui.com/components/toggle</a>（MIT）</p>
</header>

<main class="doc-wrap">

  <section class="doc-block">
    <h2>基础</h2>
    <div class="doc-stage">
      <input type="checkbox" checked="checked" class="toggle" />
      <input type="checkbox" class="toggle" />
    </div>
  </section>

  <section class="doc-block">
    <h2>设置项</h2>
    <div class="doc-stage">
      <fieldset class="fieldset bg-base-100 border-base-300 rounded-box w-72 border p-4">
        <legend class="fieldset-legend">偏好设置</legend>
        <label class="label cursor-pointer"><span>深色模式</span><input type="checkbox" checked="checked" class="toggle toggle-primary" /></label>
        <label class="label cursor-pointer"><span>消息推送</span><input type="checkbox" checked="checked" class="toggle toggle-success" /></label>
        <label class="label cursor-pointer"><span>自动更新</span><input type="checkbox" class="toggle" /></label>
      </fieldset>
    </div>
  </section>

  <section class="doc-block">
    <h2>尺寸</h2>
    <div class="doc-stage">
      <input type="checkbox" checked="checked" class="toggle toggle-xs" />
      <input type="checkbox" checked="checked" class="toggle toggle-sm" />
      <input type="checkbox" checked="checked" class="toggle toggle-md" />
      <input type="checkbox" checked="checked" class="toggle toggle-lg" />
      <input type="checkbox" checked="checked" class="toggle toggle-xl" />
    </div>
  </section>

  <section class="doc-block">
    <h2>颜色</h2>
    <div class="doc-stage">
      <input type="checkbox" checked="checked" class="toggle toggle-neutral" />
      <input type="checkbox" checked="checked" class="toggle toggle-primary" />
      <input type="checkbox" checked="checked" class="toggle toggle-secondary" />
      <input type="checkbox" checked="checked" class="toggle toggle-accent" />
      <input type="checkbox" checked="checked" class="toggle toggle-info" />
      <input type="checkbox" checked="checked" class="toggle toggle-success" />
      <input type="checkbox" checked="checked" class="toggle toggle-warning" />
      <input type="checkbox" checked="checked" class="toggle toggle-error" />
    </div>
  </section>

  <section class="doc-block">
    <h2>禁用</h2>
    <div class="doc-stage">
      <input type="checkbox" class="toggle" disabled />
      <input type="checkbox" class="toggle" disabled checked="checked" />
    </div>
  </section>

  <section class="doc-block">
    <h2>带图标</h2>
    <p class="desc">在 label.toggle 内放 checkbox 与两个图标（开/关），适合显示状态含义。</p>
    <div class="doc-stage">
      <label class="toggle text-base-content">
        <input type="checkbox" />
        <svg aria-label="开" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="w-3 h-3"><g stroke-linejoin="round" stroke-linecap="round" stroke-width="4" fill="none" stroke="currentColor"><path d="M20 6 9 17l-5-5"></path></g></svg>
        <svg aria-label="关" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </label>
    </div>
  </section>

</main>
</body>
</html>
