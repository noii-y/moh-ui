<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>moh-date-range · 日期范围</title>
  <link rel="stylesheet" href="../../themes/mo-light/tokens.css" />
  <style>
    /* ============================================================
       moh-date-range · 日期范围（灰墨 MoH_UI 单文件组件）
       依赖：tokens.css 的 --moh-* 变量（零 JS 依赖）
       用法：复制本文件 <style> 与需要的 HTML 片段到你的项目
       形态：原生 input[type=date] 两枚 + 至 分隔 + 快捷预设
       要点：label 显式关联；快捷按钮 aria-pressed 表达选中；
         预设的 JS 填充逻辑在注释中给出（零依赖，可自行接入）
       ============================================================ */

    .moh-date-range {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--moh-space-2);
      font-size: var(--moh-text-sm);
    }

    .moh-date-range__field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .moh-date-range__label {
      font-size: var(--moh-text-xs);
      color: var(--moh-muted);
    }

    .moh-date-range__input {
      height: var(--moh-control-height);
      padding: 0 var(--moh-space-2);
      border: 1px solid var(--moh-border);
      border-radius: var(--moh-radius-md);
      background: var(--moh-surface);
      color: var(--moh-ink);
      font-family: inherit;
      font-size: var(--moh-text-sm);
      transition: var(--moh-transition);
    }

    .moh-date-range__input:hover {
      border-color: var(--moh-border-strong);
    }

    .moh-date-range__input:focus-visible {
      outline: 2px solid var(--moh-primary);
      outline-offset: 2px;
    }

    .moh-date-range__sep {
      color: var(--moh-muted);
      padding: 0 var(--moh-space-1);
      align-self: flex-end;
      height: var(--moh-control-height);
      display: inline-flex;
      align-items: center;
    }

    /* 快捷预设 */
    .moh-date-range__presets {
      display: inline-flex;
      gap: var(--moh-space-1);
      flex-wrap: wrap;
    }

    .moh-date-range__preset {
      height: var(--moh-control-height);
      padding: 0 var(--moh-space-3);
      border: 1px solid var(--moh-border);
      border-radius: var(--moh-radius-md);
      background: var(--moh-surface);
      color: var(--moh-muted);
      font-size: var(--moh-text-sm);
      font-family: inherit;
      cursor: pointer;
      transition: var(--moh-transition);
    }

    .moh-date-range__preset:hover {
      color: var(--moh-ink);
      border-color: var(--moh-border-strong);
    }

    .moh-date-range__preset:focus-visible {
      outline: 2px solid var(--moh-primary);
      outline-offset: 2px;
    }

    /* 选中态 */
    .moh-date-range__preset[aria-pressed="true"] {
      background: var(--moh-primary-muted);
      border-color: var(--moh-primary);
      color: var(--moh-primary);
    }

    /* ========== 演示容器（非组件样式） ========== */
    .demo-wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--moh-space-4);
      padding: var(--moh-space-6);
      background: var(--moh-canvas);
      border-bottom: 1px solid var(--moh-border);
    }
    .demo-note {
      font-size: var(--moh-text-xs);
      color: var(--moh-muted);
      padding: var(--moh-space-3) var(--moh-space-6);
      margin: 0;
      background: var(--moh-canvas);
    }
  </style>
</head>
<body>
  <div class="demo-wrap">
    <div class="moh-date-range">
      <div class="moh-date-range__field">
        <label class="moh-date-range__label" for="dr-start">开始日期</label>
        <input class="moh-date-range__input" id="dr-start" type="date" value="2026-10-01" />
      </div>
      <span class="moh-date-range__sep" aria-hidden="true">至</span>
      <div class="moh-date-range__field">
        <label class="moh-date-range__label" for="dr-end">结束日期</label>
        <input class="moh-date-range__input" id="dr-end" type="date" value="2026-10-15" />
      </div>
    </div>
  </div>

  <div class="demo-wrap">
    <div class="moh-date-range">
      <div class="moh-date-range__presets" role="group" aria-label="快捷预设">
        <button class="moh-date-range__preset" aria-pressed="true">今天</button>
        <button class="moh-date-range__preset" aria-pressed="false">近 7 天</button>
        <button class="moh-date-range__preset" aria-pressed="false">近 30 天</button>
        <button class="moh-date-range__preset" aria-pressed="false">本月</button>
      </div>
    </div>
  </div>

  <script>
    /* 零依赖填充逻辑（示例：接上预设按钮与两个 date input 后可用）
       presets.forEach(btn => btn.addEventListener("click", () => {
         presets.forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
         const now = new Date();
         const days = { "今天": 0, "近 7 天": 6, "近 30 天": 29, "本月": 0 };
         const iso = (d) => d.toISOString().slice(0, 10);
         start.value = iso(new Date(now - (days[btn.textContent] || 0) * 86400000));
         end.value = iso(now);
       }));
    */
  </script>
  <p class="demo-note">提示：原生 date input 提供日历面板（零依赖）；快捷按钮 aria-pressed 表达选中；预设填充逻辑见脚本注释。</p>
</body>
</html>
