<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>moh-drag-sort · 拖拽排序</title>
  <link rel="stylesheet" href="../../themes/mo-light/tokens.css" />
  <style>
    /* ============================================================
       moh-drag-sort · 拖拽排序（灰墨 MoH_UI 增强组件）
       依赖：无（原生 HTML5 drag API），交互复杂故列增强档
       用法：复制 <style> + HTML 片段 + <script> 到你的项目
       行为标准：鼠标拖拽换序 + 键盘替代（焦点在把手时 ↑/↓ 移动）；
         拖拽中目标位高亮；aria-live 播报"已移动到第 N 位"
       ============================================================ */

    .moh-drag-sort {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: var(--moh-space-2);
      max-width: 400px;
    }

    .moh-drag-sort__item {
      display: flex;
      align-items: center;
      gap: var(--moh-space-3);
      padding: var(--moh-space-2) var(--moh-space-3);
      background: var(--moh-surface);
      border: 1px solid var(--moh-border);
      border-radius: var(--moh-radius-md);
      font-size: var(--moh-text-sm);
      color: var(--moh-ink);
      transition: border-color var(--moh-transition), box-shadow var(--moh-transition);
    }

    /* 拖拽中：目标位高亮 */
    .moh-drag-sort__item--over {
      border-color: var(--moh-primary);
      box-shadow: 0 0 0 1px var(--moh-primary);
    }

    .moh-drag-sort__item--dragging {
      opacity: 0.5;
    }

    .moh-drag-sort__label {
      flex: 1;
    }

    /* 拖拽把手：也是键盘移动入口 */
    .moh-drag-sort__handle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border: 1px solid var(--moh-border);
      border-radius: var(--moh-radius-sm);
      background: var(--moh-surface-2);
      color: var(--moh-muted);
      font-size: var(--moh-text-sm);
      line-height: 1;
      cursor: grab;
      transition: var(--moh-transition);
    }
    .moh-drag-sort__handle:hover {
      color: var(--moh-ink);
      border-color: var(--moh-border-strong);
    }
    .moh-drag-sort__handle:focus-visible {
      outline: 2px solid var(--moh-primary);
      outline-offset: 2px;
    }

    /* ========== 演示容器（非组件样式） ========== */
    .demo-wrap {
      padding: var(--moh-space-6);
      background: var(--moh-canvas);
      border-bottom: 1px solid var(--moh-border);
    }
    .demo-note {
      font-size: var(--moh-text-xs);
      color: var(--moh-muted);
      padding: var(--moh-space-3) var(--moh-space-6);
      margin: 0;
      background: var(--moh-canvas);
    }
  </style>
</head>
<body>
  <div class="demo-wrap">
    <ul class="moh-drag-sort" id="demo-sort">
      <li class="moh-drag-sort__item" draggable="true" data-label="用户管理">
        <button class="moh-drag-sort__handle" aria-label="移动：用户管理" aria-describedby="sort-live">≡</button>
        <span class="moh-drag-sort__label">用户管理</span>
      </li>
      <li class="moh-drag-sort__item" draggable="true" data-label="角色与权限">
        <button class="moh-drag-sort__handle" aria-label="移动：角色与权限" aria-describedby="sort-live">≡</button>
        <span class="moh-drag-sort__label">角色与权限</span>
      </li>
      <li class="moh-drag-sort__item" draggable="true" data-label="审计日志">
        <button class="moh-drag-sort__handle" aria-label="移动：审计日志" aria-describedby="sort-live">≡</button>
        <span class="moh-drag-sort__label">审计日志</span>
      </li>
      <li class="moh-drag-sort__item" draggable="true" data-label="系统设置">
        <button class="moh-drag-sort__handle" aria-label="移动：系统设置" aria-describedby="sort-live">≡</button>
        <span class="moh-drag-sort__label">系统设置</span>
      </li>
    </ul>
    <div class="moh-drag-sort__live" id="sort-live" aria-live="polite" style="font-size:0;height:0;overflow:hidden"></div>
  </div>

  <script>
    /* 行为：拖拽换序 + 键盘替代 + aria-live 播报 */
    (function () {
      const list = document.getElementById("demo-sort");
      const live = document.getElementById("sort-live");
      const items = () => Array.from(list.children);
      let dragging = null;

      function speak(text) {
        live.textContent = "";
        // 触发两次以确保屏读播报
        requestAnimationFrame(() => { live.textContent = text; });
      }

      function moveItem(item, targetIndex) {
        const arr = items();
        const from = arr.indexOf(item);
        if (from < 0 || targetIndex < 0 || targetIndex >= arr.length || from === targetIndex) return;
        if (from < targetIndex) list.insertBefore(item, arr[targetIndex + 1] || null);
        else list.insertBefore(item, arr[targetIndex]);
        speak("已将 " + item.dataset.label + " 移动到第 " + (targetIndex + 1) + " 位");
        item.querySelector(".moh-drag-sort__handle").focus();
      }

      // 鼠标 / 触控拖拽
      list.addEventListener("dragstart", (e) => {
        const item = e.target.closest(".moh-drag-sort__item");
        if (!item) return;
        dragging = item;
        item.classList.add("moh-drag-sort__item--dragging");
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", item.dataset.label);
      });

      list.addEventListener("dragover", (e) => {
        e.preventDefault();
        const item = e.target.closest(".moh-drag-sort__item");
        if (!item || item === dragging) return;
        const rect = item.getBoundingClientRect();
        const after = e.clientY > rect.top + rect.height / 2;
        item.classList.toggle("moh-drag-sort__item--over", after === false || true);
        // 简单实现：交换到鼠标所在项的位置
        const arr = items();
        const to = arr.indexOf(item);
        const from = arr.indexOf(dragging);
        if (from >= 0 && to >= 0 && from !== to) {
          list.insertBefore(dragging, after ? item.nextSibling : item);
        }
      });

      list.addEventListener("drop", (e) => {
        e.preventDefault();
        const item = e.target.closest(".moh-drag-sort__item");
        if (item && item !== dragging) {
          const arr = items();
          speak("已将 " + dragging.dataset.label + " 移动到第 " + (arr.indexOf(dragging) + 1) + " 位");
        }
      });

      list.addEventListener("dragend", () => {
        items().forEach((el) => el.classList.remove("moh-drag-sort__item--dragging", "moh-drag-sort__item--over"));
        dragging = null;
      });

      // 键盘替代：焦点在把手时 ↑/↓ 移动
      list.addEventListener("keydown", (e) => {
        const handle = e.target.closest(".moh-drag-sort__handle");
        if (!handle) return;
        const item = handle.closest(".moh-drag-sort__item");
        const arr = items();
        const idx = arr.indexOf(item);
        if (e.key === "ArrowUp" && idx > 0) {
          e.preventDefault();
          moveItem(item, idx - 1);
        } else if (e.key === "ArrowDown" && idx < arr.length - 1) {
          e.preventDefault();
          moveItem(item, idx + 1);
        }
      });
    })();
  </script>
  <p class="demo-note">提示：鼠标拖拽换序；把手的焦点上 ↑/↓ 键移动（键盘替代）；aria-live 播报移动结果；拖拽中目标位主色高亮。</p>
</body>
</html>
