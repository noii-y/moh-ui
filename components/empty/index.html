<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>moh-empty · 空状态</title>
  <link rel="stylesheet" href="../../themes/mo-light/tokens.css" />
  <style>
    /* ============================================================
       moh-empty · 空状态（灰墨 MoH_UI 单文件组件）
       依赖：tokens.css 的 --moh-* 变量
       用法：复制本文件 <style> 与需要的 HTML 片段到你的项目
       形态：图标 + 标题 + 说明 + 可选操作按钮；紧凑变体供表格内嵌
       要点：文案鼓励下一步动作；图标颜色跟随 currentColor（禁用硬编码色）
       ============================================================ */

    .moh-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--moh-space-2);
      padding: var(--moh-space-8) var(--moh-space-6);
      text-align: center;
      color: var(--moh-muted);
    }

    /* 图标：颜色随容器文字色（muted） */
    .moh-empty__icon {
      width: 56px;
      height: 56px;
      color: var(--moh-border-strong);
      margin-bottom: var(--moh-space-2);
    }

    .moh-empty__icon svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .moh-empty__title {
      font-size: var(--moh-text-md);
      font-weight: 600;
      color: var(--moh-ink);
    }

    .moh-empty__desc {
      font-size: var(--moh-text-sm);
      max-width: 280px;
      line-height: 1.6;
    }

    .moh-empty__action {
      margin-top: var(--moh-space-3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--moh-space-1);
      height: var(--moh-control-height);
      padding: 0 var(--moh-space-4);
      border: 1px solid transparent;
      border-radius: var(--moh-radius-md);
      background: var(--moh-primary);
      color: #ffffff;
      font-size: var(--moh-text-sm);
      font-weight: 500;
      font-family: inherit;
      line-height: 1;
      cursor: pointer;
      transition: var(--moh-transition);
    }

    .moh-empty__action:hover {
      background: var(--moh-primary-hover);
    }

    .moh-empty__action:focus-visible {
      outline: 2px solid var(--moh-primary);
      outline-offset: 2px;
    }

    /* 紧凑变体（表格内嵌空行）：横向、缩小间距 */
    .moh-empty--compact {
      flex-direction: row;
      gap: var(--moh-space-3);
      padding: var(--moh-space-6);
    }

    .moh-empty--compact .moh-empty__icon {
      width: 32px;
      height: 32px;
      margin-bottom: 0;
    }

    .moh-empty--compact .moh-empty__title {
      font-size: var(--moh-text-sm);
    }

    /* ========== 演示容器（非组件样式） ========== */
    .demo-wrap {
      padding: var(--moh-space-6);
      background: var(--moh-canvas);
      border-bottom: 1px solid var(--moh-border);
    }
    .demo-note {
      font-size: var(--moh-text-xs);
      color: var(--moh-muted);
      padding: var(--moh-space-3) var(--moh-space-6);
      margin: 0;
      background: var(--moh-canvas);
    }
  </style>
</head>
<body>
  <!-- 默认变体：带操作按钮 -->
  <div class="demo-wrap">
    <div class="moh-empty">
      <div class="moh-empty__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 3v12" /><path d="m7 10 5 5 5-5" /><path d="M5 21h14" /></svg>
      </div>
      <div class="moh-empty__title">还没有项目</div>
      <div class="moh-empty__desc">创建第一个项目，把团队的协作和文档都收拢到一起。</div>
      <button class="moh-empty__action">新建项目</button>
    </div>
  </div>

  <!-- 默认变体：无操作 -->
  <div class="demo-wrap">
    <div class="moh-empty">
      <div class="moh-empty__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
      </div>
      <div class="moh-empty__title">没有匹配的结果</div>
      <div class="moh-empty__desc">换个关键词试试，或者清空筛选条件。</div>
    </div>
  </div>

  <!-- 紧凑变体：表格内空行 -->
  <div class="demo-wrap">
    <div class="moh-empty moh-empty--compact">
      <div class="moh-empty__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M3 9h18" /><path d="M8 14h8" /></svg>
      </div>
      <div class="moh-empty__title">暂无数据</div>
      <div class="moh-empty__desc">本筛选条件下没有记录。</div>
    </div>
  </div>
  <p class="demo-note">提示：文案写"下一步动作"而非空话；图标颜色用 currentColor 跟随主题；紧凑变体适合表格空行。</p>
</body>
</html>
