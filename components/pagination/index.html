<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>moh-pagination · 分页</title>
  <link rel="stylesheet" href="../../themes/mo-light/tokens.css" />
  <style>
    /* ============================================================
       moh-pagination · 分页（灰墨 MoH_UI 单文件组件）
       依赖：tokens.css 的 --moh-* 变量
       用法：复制本文件 <style> 与需要的 HTML 片段到你的项目
       形态：上一页/下一页 + 页码 + 省略号 + 总数标签
       行为标准：nav[aria-label] + ul/li；当前页标 aria-current；
         省略号 aria-hidden；边界页禁用态（disabled 不可点）
       ============================================================ */

    .moh-pagination {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--moh-space-1);
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: var(--moh-text-sm);
    }

    .moh-pagination__item {
      display: inline-flex;
      align-items: center;
    }

    /* 页码 / 上下页按钮 */
    .moh-pagination__btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 30px;
      height: 30px;
      padding: 0 var(--moh-space-2);
      border: 1px solid var(--moh-border);
      border-radius: var(--moh-radius-sm);
      background: var(--moh-surface);
      color: var(--moh-ink);
      font-size: var(--moh-text-sm);
      font-family: inherit;
      line-height: 1;
      cursor: pointer;
      transition: var(--moh-transition);
    }

    .moh-pagination__btn:hover:not(:disabled):not(.moh-pagination__btn--current) {
      border-color: var(--moh-border-strong);
      background: var(--moh-surface-2);
    }

    .moh-pagination__btn:focus-visible {
      outline: 2px solid var(--moh-primary);
      outline-offset: 2px;
    }

    .moh-pagination__btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* 当前页：主色底、白字、非链接 */
    .moh-pagination__btn--current {
      background: var(--moh-primary);
      border-color: var(--moh-primary);
      color: #ffffff;
      cursor: default;
      font-weight: 500;
    }

    /* 省略号：屏读跳过 */
    .moh-pagination__ellipsis {
      padding: 0 var(--moh-space-1);
      color: var(--moh-muted);
      user-select: none;
    }

    /* 总数标签（可选） */
    .moh-pagination__total {
      margin-left: var(--moh-space-3);
      color: var(--moh-muted);
      font-size: var(--moh-text-xs);
    }

    /* ========== 演示容器（非组件样式） ========== */
    .demo-wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--moh-space-4);
      padding: var(--moh-space-6);
      background: var(--moh-canvas);
      border-bottom: 1px solid var(--moh-border);
    }
    .demo-note {
      font-size: var(--moh-text-xs);
      color: var(--moh-muted);
      padding: var(--moh-space-3) var(--moh-space-6);
      margin: 0;
      background: var(--moh-canvas);
    }
  </style>
</head>
<body>
  <div class="demo-wrap">
    <nav aria-label="分页">
      <ul class="moh-pagination">
        <li class="moh-pagination__item">
          <button class="moh-pagination__btn" disabled aria-label="上一页">‹</button>
        </li>
        <li class="moh-pagination__item">
          <button class="moh-pagination__btn moh-pagination__btn--current" aria-current="page">1</button>
        </li>
        <li class="moh-pagination__item">
          <button class="moh-pagination__btn">2</button>
        </li>
        <li class="moh-pagination__item">
          <button class="moh-pagination__btn">3</button>
        </li>
        <li class="moh-pagination__item">
          <span class="moh-pagination__ellipsis" aria-hidden="true">…</span>
        </li>
        <li class="moh-pagination__item">
          <button class="moh-pagination__btn">12</button>
        </li>
        <li class="moh-pagination__item">
          <button class="moh-pagination__btn" aria-label="下一页">›</button>
        </li>
      </ul>
      <span class="moh-pagination__total">共 128 条</span>
    </nav>
  </div>

  <div class="demo-wrap">
    <nav aria-label="分页（无总数标签）">
      <ul class="moh-pagination">
        <li class="moh-pagination__item">
          <button class="moh-pagination__btn" aria-label="上一页">‹</button>
        </li>
        <li class="moh-pagination__item">
          <button class="moh-pagination__btn">4</button>
        </li>
        <li class="moh-pagination__item">
          <button class="moh-pagination__btn moh-pagination__btn--current" aria-current="page">5</button>
        </li>
        <li class="moh-pagination__item">
          <button class="moh-pagination__btn">6</button>
        </li>
        <li class="moh-pagination__item">
          <button class="moh-pagination__btn" aria-label="下一页">›</button>
        </li>
      </ul>
    </nav>
  </div>
  <p class="demo-note">提示：当前页用主色底白字且不可点；省略号对屏读隐藏；边界页（第一页的上一页）用 disabled 表达。</p>
</body>
</html>
