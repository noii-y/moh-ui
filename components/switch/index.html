<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>moh-switch · 开关</title>
  <link rel="stylesheet" href="../../themes/mo-light/tokens.css" />
  <style>
    /* ============================================================
       moh-switch · 开关（灰墨 MoH_UI 单文件组件）
       依赖：tokens.css 的 --moh-* 变量
       用法：复制本文件 <style> 与需要的 HTML 片段到你的项目
       形态：轨道 + 滑块；:checked 时主色
       要点：原生 input 视觉隐藏但保留语义（空格切换、屏读）；
         焦点可见 outline；禁用态降透明度
       ============================================================ */

    .moh-switch {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: var(--moh-space-2);
      font-size: var(--moh-text-sm);
      color: var(--moh-ink);
      cursor: pointer;
      user-select: none;
    }

    /* 原生 input：视觉隐藏，语义保留 */
    .moh-switch__input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      margin: 0;
    }

    /* 轨道 */
    .moh-switch__track {
      display: inline-flex;
      align-items: center;
      width: 36px;
      height: 20px;
      padding: 2px;
      border-radius: 10px;
      background: var(--moh-border-strong);
      transition: background var(--moh-transition);
      flex-shrink: 0;
    }

    /* 滑块 */
    .moh-switch__thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--moh-surface);
      box-shadow: var(--moh-shadow-sm);
      transition: transform var(--moh-transition);
    }

    /* 选中态：主色轨道 + 滑块右移 */
    .moh-switch__input:checked + .moh-switch__track {
      background: var(--moh-primary);
    }
    .moh-switch__input:checked + .moh-switch__track .moh-switch__thumb {
      transform: translateX(16px);
    }

    /* 焦点可见（input 视觉隐藏，outline 画在轨道上） */
    .moh-switch__input:focus-visible + .moh-switch__track {
      outline: 2px solid var(--moh-primary);
      outline-offset: 2px;
    }

    /* 禁用态 */
    .moh-switch--disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .moh-switch--disabled .moh-switch__input,
    .moh-switch--disabled .moh-switch__track {
      cursor: not-allowed;
    }

    /* ========== 演示容器（非组件样式） ========== */
    .demo-wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--moh-space-4);
      padding: var(--moh-space-6);
      background: var(--moh-canvas);
      border-bottom: 1px solid var(--moh-border);
    }
    .demo-note {
      font-size: var(--moh-text-xs);
      color: var(--moh-muted);
      padding: var(--moh-space-3) var(--moh-space-6);
      margin: 0;
      background: var(--moh-canvas);
    }
  </style>
</head>
<body>
  <div class="demo-wrap">
    <label class="moh-switch">
      <input class="moh-switch__input" type="checkbox" role="switch" checked />
      <span class="moh-switch__track"><span class="moh-switch__thumb"></span></span>
      <span>自动更新</span>
    </label>
    <label class="moh-switch">
      <input class="moh-switch__input" type="checkbox" role="switch" />
      <span class="moh-switch__track"><span class="moh-switch__thumb"></span></span>
      <span>夜间模式</span>
    </label>
    <label class="moh-switch moh-switch--disabled">
      <input class="moh-switch__input" type="checkbox" role="switch" disabled />
      <span class="moh-switch__track"><span class="moh-switch__thumb"></span></span>
      <span>已停用的开关</span>
    </label>
  </div>
  <p class="demo-note">提示：role="switch" 让屏读读作"开关"；空格切换；选中态轨道变主色、滑块右移；焦点可见画在轨道上。</p>
</body>
</html>
