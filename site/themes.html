<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>主题库 · 灰墨 MoH_UI</title>
  <meta name="description" content="灰墨主题库：10 套真实色板主题，统一 --moh-* 变量，全部体检 100 分。按风格筛选，一键复制 tokens / AI 指令。" />
  <link rel="stylesheet" href="../themes/mo-dark/tokens.css" />
  <link rel="stylesheet" href="assets/site.css" />
</head>
<body>
  <nav class="site-nav">
    <div class="site-container site-nav__inner">
      <a class="site-nav__brand" href="../index.html">
        <span class="site-nav__logo"></span>
        灰墨 MoH_UI
      </a>
      <div class="site-nav__links">
        <a class="site-nav__link" href="../index.html">首页</a>
        <a class="site-nav__link site-nav__link--active" href="themes.html">主题</a>
        <a class="site-nav__link" href="components.html">组件</a>
        <a class="site-nav__link" href="rules.html">规则</a>
        <a class="site-nav__link" href="generator.html">选择器</a>
      </div>
      <a class="site-nav__gh" href="https://github.com/noii-y/moh-ui" target="_blank" rel="noopener">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.56v-2c-3.2.7-3.87-1.54-3.87-1.54-.53-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.23-1.28-5.23-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.68 5.38-5.24 5.67.41.35.78 1.05.78 2.12v3.14c0 .31.21.66.8.55A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5Z"/></svg>
        GitHub
      </a>
    </div>
  </nav>

  <div class="site-container">
    <div class="site-pagehead">
      <h1>主题库 <span id="theme-count" style="font-size:16px;color:var(--moh-muted)"></span></h1>
      <p>10 套真实色板，统一 <code>--moh-*</code> 变量，全部通过体检 100/100。点击卡片预览整页效果；一键复制 tokens 或 AI 指令。</p>
    </div>

    <div class="site-toolbar">
      <label class="site-search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m21 21-4-4" /></svg>
        <input id="search" type="search" placeholder="搜索主题名 / 风格…" aria-label="搜索主题" />
      </label>
      <div class="site-filters" id="filters"></div>
    </div>

    <div class="site-grid" id="grid"></div>
  </div>

  <!-- 预览弹层 -->
  <div class="site-modal" id="modal" role="dialog" aria-modal="true" aria-label="主题预览">
    <div class="site-modal__panel">
      <div class="site-modal__head">
        <p class="site-modal__title" id="modal-title"></p>
        <div class="site-modal__nav">
          <button class="site-modal__close" id="prev-btn" aria-label="上一个主题">←</button>
          <button class="site-modal__close" id="next-btn" aria-label="下一个主题">→</button>
          <button class="site-modal__close" id="close-btn" aria-label="关闭">✕</button>
        </div>
      </div>
      <div class="site-modal__body"><iframe id="modal-frame" title="主题预览"></iframe></div>
      <div class="site-modal__foot">
        <button class="site-btn site-btn--secondary site-btn--sm" id="copy-tokens">复制 tokens.css</button>
        <button class="site-btn site-btn--secondary site-btn--sm" id="copy-ai">复制 AI 指令</button>
        <button class="site-btn site-btn--secondary site-btn--sm" id="download-tokens">下载 tokens.css</button>
        <a class="site-btn site-btn--primary site-btn--sm" id="src-link" target="_blank" rel="noopener">查看源码</a>
      </div>
    </div>
  </div>

  <div class="site-toast" id="toast" role="status">已复制 ✓</div>

  <footer class="site-footer">
    <div class="site-container">灰墨 MoH_UI · MIT License · <a href="https://github.com/noii-y/moh-ui" target="_blank" rel="noopener">GitHub</a></div>
  </footer>

  <script src="data.js"></script>
  <script>
    var DATA = window.MOH_DATA;
    var grid = document.getElementById("grid");
    var filters = document.getElementById("filters");
    var search = document.getElementById("search");
    var modal = document.getElementById("modal");
    var modalFrame = document.getElementById("modal-frame");
    var modalTitle = document.getElementById("modal-title");

    var tag = new URLSearchParams(location.search).get("tag") || "全部";
    var q = new URLSearchParams(location.search).get("q") || "";

    document.getElementById("theme-count").textContent = "· " + DATA.stats.themes + " 套";

    /* 筛选栏 */
    var tags = ["全部"].concat(DATA.themeTags);
    filters.innerHTML = tags.map(function (t) {
      return '<button class="site-filter' + (t === tag ? " site-filter--active" : "") + '" data-tag="' + t + '">' + t + "</button>";
    }).join("");

    /* 色板条 */
    function swatch(p) {
      var cells = [
        ["canvas", p.canvas], ["surface", p.surface], ["border", p.border],
        ["primary", p.primary], ["success", p.success], ["danger", p.danger]
      ].filter(function (c) { return c[1]; });
      return '<span class="site-swatch" aria-hidden="true">' + cells.map(function (c) {
        return '<span class="site-swatch__cell" style="background:' + c[1] + '"></span>';
      }).join("") + "</span>";
    }

    /* 灵感来源小字 */
    function originLabel(t) {
      if (t.origin === "original" && t.inspiration && t.inspiration.length) {
        var src = t.inspiration.map(function (u) { return u.replace(/^https?:\/\//, "").slice(0, 36); }).join(" / ");
        return "灵感：" + src;
      }
      return t.origin === "original" ? "自研色板" : "二创（见溯源）";
    }

    function render() {
      var list = DATA.themes.filter(function (t) {
        var okTag = tag === "全部" || t.styleTags.indexOf(tag) !== -1;
        var hay = (t.name + " " + t.title + " " + t.description + " " + t.styleTags.join(" ")).toLowerCase();
        var okQ = !q || hay.indexOf(q.toLowerCase()) !== -1;
        return okTag && okQ;
      });

      if (!list.length) {
        grid.innerHTML = '<div class="site-empty"><div class="site-empty__icon">🫥</div><p>没有匹配的主题，换个标签或关键词试试。</p></div>';
        return;
      }

      grid.innerHTML = list.map(function (t) {
        return (
          '<div class="site-card" data-name="' + t.name + '" tabindex="0" role="button" aria-label="预览主题 ' + t.title + '">' +
          '<iframe class="site-card__frame" src="../themes/' + t.slug + '/preview.html" loading="lazy" title="' + t.title + ' 预览"></iframe>' +
          '<div class="site-card__body">' +
          '<p class="site-card__title">' + t.title + ' <span class="site-chip site-chip--ok">audit ' + t.audit + '</span></p>' +
          '<p class="site-card__desc">' + t.description + '</p>' +
          swatch(t.palette) +
          '<div class="site-card__meta">' +
          '<span class="site-chip">' + t.styleTags.join(" / ") + "</span>" +
          '<span class="site-chip">' + t.license + "</span>" +
          '<span class="site-chip">' + originLabel(t) + "</span>" +
          "</div></div></div>"
        );
      }).join("");
    }

    /* URL 同步 */
    function syncUrl() {
      var u = new URLSearchParams();
      if (tag !== "全部") u.set("tag", tag);
      if (q) u.set("q", q);
      history.replaceState(null, "", location.pathname + (u.toString() ? "?" + u.toString() : ""));
    }

    filters.addEventListener("click", function (e) {
      var b = e.target.closest(".site-filter");
      if (!b) return;
      tag = b.dataset.tag;
      filters.querySelectorAll(".site-filter").forEach(function (x) { x.classList.toggle("site-filter--active", x === b); });
      syncUrl();
      render();
    });

    var searchTimer;
    search.addEventListener("input", function () {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () {
        q = search.value.trim();
        syncUrl();
        render();
      }, 200);
    });

    /* 弹层 */
    var current = null;
    var listOrder = [];

    function openModal(name) {
      var idx = listOrder.indexOf(name);
      if (idx === -1) return;
      var t = DATA.themes.filter(function (x) { return x.name === name; })[0];
      current = t;
      modalTitle.textContent = t.title + " · " + t.name;
      modalFrame.src = "../themes/" + t.slug + "/preview.html";
      document.getElementById("src-link").href = "https://github.com/noii-y/moh-ui/tree/master/themes/" + t.slug;
      modal.classList.add("site-modal--open");
      document.body.style.overflow = "hidden";
      modalFrame.focus();
    }

    function closeModal() {
      modal.classList.remove("site-modal--open");
      document.body.style.overflow = "";
      modalFrame.src = "about:blank";
      current = null;
    }

    function stepModal(dir) {
      var idx = listOrder.indexOf(current.name);
      var next = listOrder[(idx + dir + listOrder.length) % listOrder.length];
      openModal(next);
    }

    function currentList() {
      listOrder = DATA.themes.map(function (t) { return t.name; });
    }

    grid.addEventListener("click", function (e) {
      var card = e.target.closest(".site-card");
      if (!card) return;
      currentList();
      openModal(card.dataset.name);
    });
    grid.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        var card = e.target.closest(".site-card");
        if (card) { e.preventDefault(); currentList(); openModal(card.dataset.name); }
      }
    });

    document.getElementById("close-btn").addEventListener("click", closeModal);
    document.getElementById("prev-btn").addEventListener("click", function () { if (current) stepModal(-1); });
    document.getElementById("next-btn").addEventListener("click", function () { if (current) stepModal(1); });
    modal.addEventListener("click", function (e) { if (e.target === modal) closeModal(); });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && modal.classList.contains("site-modal--open")) closeModal();
      if (modal.classList.contains("site-modal--open") && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
        stepModal(e.key === "ArrowLeft" ? -1 : 1);
      }
    });

    /* 复制 / 下载 */
    var toast = document.getElementById("toast");
    var toastTimer;
    function showToast(text) {
      toast.textContent = text;
      toast.classList.add("site-toast--show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove("site-toast--show"); }, 1500);
    }
    function copyText(text, okText) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(function () { showToast(okText); });
      } else {
        showToast("复制失败：请手动选择复制");
      }
    }

    document.getElementById("copy-tokens").addEventListener("click", function () {
      if (!current) return;
      fetch("../themes/" + current.slug + "/tokens.css")
        .then(function (r) { return r.text(); })
        .then(function (css) { copyText(css, "tokens.css 已复制 ✓"); })
        .catch(function () { showToast("复制失败：请到仓库取文件"); });
    });

    document.getElementById("copy-ai").addEventListener("click", function () {
      if (!current) return;
      var cmd =
        "请把灰墨 MoH_UI 的主题「" + current.title + "（" + current.name + "）」应用到当前项目。\n" +
        "风格：" + current.description + "\n" +
        "做法：读取 https://noii-y.github.io/moh-ui/themes/" + current.slug + "/preview.html 的基准效果，引入该主题的 tokens.css 与 base.css（仓库目录：https://github.com/noii-y/moh-ui/tree/master/themes/" + current.slug + "），清理硬编码颜色，类名统一 moh- 前缀，全部走 var(--moh-*) 变量。\n" +
        "应用后按规则包自检清单逐项自查（https://noii-y.github.io/moh-ui/site/rules.html），字号阶 12/13/14/16/20/24、间距 4 的倍数、控件 32px、动效 ≤200ms，达标再交付。";
      copyText(cmd, "AI 指令已复制 ✓");
    });

    document.getElementById("download-tokens").addEventListener("click", function () {
      if (!current) return;
      fetch("../themes/" + current.slug + "/tokens.css")
        .then(function (r) { return r.text(); })
        .then(function (css) {
          var blob = new Blob([css], { type: "text/css" });
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = current.name + "-tokens.css";
          a.click();
          URL.revokeObjectURL(a.href);
          showToast("已下载 ✓");
        })
        .catch(function () { showToast("下载失败：请到仓库取文件"); });
    });

    search.value = q;
    render();
  </script>
</body>
</html>
